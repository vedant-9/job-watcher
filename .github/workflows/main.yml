name: job-watcher

on:
  schedule:
    # Fires every 2 hours because GitHub drops or delays some scheduled runs. watcher.py skips a
    # scheduled run if the last run was under min_gap_hours ago (config.json), so you get about 4 real runs a day.
    # An odd minute avoids GitHub's busiest start times.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "Empty = normal run. 'check' = test every source. A company name = list all its current matches."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: job-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ "$ONLY" = "check" ]; then
            python watcher.py --check
          elif [ -n "$ONLY" ]; then
            python watcher.py --only "$ONLY"
          else
            python watcher.py
          fi
      - name: Save state
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          for f in seen.json jobs_log.md status.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || git commit -m "watcher update"
          git pull --rebase --autostash || true
          git push
