name: job-watcher

on:
  schedule:
    - cron: "30 2 * * *"   # daily at 08:00 IST (02:30 UTC)
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: company name (e.g. Walmart) to list ALL its current matching openings"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run watcher
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ONLY: ${{ inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python watcher.py --only "$ONLY"; else python watcher.py; fi
      - name: Save seen jobs
        run: |
          git config user.name "job-watcher"
          git config user.email "job-watcher@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || (git commit -m "update seen jobs" && git push)
